<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="description" content="六款竞品游戏的卡池版本区间、预计更新时间与中英日韩舆情报告资料库">
  <title>竞品版本与舆情资料库</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/site.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <div>
          <h1>竞品版本与舆情资料库</h1>
          <p>卡池排期、预计更新时间与中英日韩舆情报告统一查询</p>
        </div>
      </div>
      <nav class="header-nav" aria-label="页面导航">
        <a href="#latest">最新卡池</a>
        <a href="#archive">报告档案</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="section" id="latest" aria-labelledby="latestTitle">
      <div class="section-heading">
        <div>
          <span class="eyebrow">CURRENT SCHEDULE</span>
          <h2 id="latestTitle">最新卡池概览</h2>
          <p>优先展示正在进行的卡池；没有进行中记录时展示最近一期。</p>
        </div>
        <div class="update-badge" id="updateBadge">正在读取数据</div>
      </div>
      <div class="latest-grid" id="latestGrid" aria-live="polite">
        <div class="loading-card">正在加载最新卡池数据…</div>
      </div>
    </section>

    <section class="section archive-section" id="archive" aria-labelledby="archiveTitle">
      <div class="section-heading archive-heading">
        <div>
          <span class="eyebrow">REPORT LIBRARY</span>
          <h2 id="archiveTitle">版本舆情报告档案</h2>
          <p>按游戏、版本、角色或语言快速找到对应报告，并可在线查看或下载到本地。</p>
        </div>
      </div>

      <div class="filter-bar" role="search">
        <label class="search-field">
          <span>搜索</span>
          <input id="searchInput" type="search" placeholder="输入版本号或角色名，例如：4.4、桑多涅" autocomplete="off">
        </label>
        <label>
          <span>游戏</span>
          <select id="gameFilter">
            <option value="all">全部游戏</option>
          </select>
        </label>
        <label>
          <span>报告状态</span>
          <select id="reportFilter">
            <option value="all">全部版本</option>
            <option value="ready">已有报告</option>
            <option value="missing">暂无报告</option>
          </select>
        </label>
        <button class="reset-button" id="resetFilters" type="button">清除筛选</button>
      </div>

      <div class="result-summary" id="resultSummary"></div>
      <div class="archive-grid" id="archiveGrid" aria-live="polite"></div>
    </section>
  </main>

  <div class="download-toast" id="downloadToast" role="status" aria-live="polite"></div>

  <footer>
    <span>数据按北京时间自然日展示；预估日期将在官方公告发布后更新。</span>
    <span id="footerUpdated"></span>
  </footer>

  <noscript>此页面需要启用 JavaScript 才能读取卡池与报告目录。</noscript>
  <script src="assets/site.js?v=20260817-top10" defer></script>
</body>
</html>
